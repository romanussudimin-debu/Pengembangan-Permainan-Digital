# Membangun APK Android game dengan Godot lalu menerbitkannya di halaman Releases
# (tag "apk-terbaru"), supaya APK bisa langsung diunduh dan dipasang di HP Android.
name: Bangun APK Android

on:
  push:
    branches: [main, "claude/**"]
    paths: ["src/**", "tools/android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android
  cancel-in-progress: true

env:
  # Versi yang sama dengan project (config/features "4.3"); ekspor Android sudah diuji dengan versi ini.
  GODOT_VERSI: "4.3"

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Siapkan Java 17 (dibutuhkan ekspor Android Godot 4.3)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Unduh Godot dan template Android
        run: |
          V="${GODOT_VERSI}-stable"
          URL="https://github.com/godotengine/godot/releases/download/${V}"
          wget -q "${URL}/Godot_v${V}_linux.x86_64.zip" -O godot.zip
          wget -q "${URL}/Godot_v${V}_export_templates.tpz" -O templates.tpz
          unzip -q godot.zip && sudo mv "Godot_v${V}_linux.x86_64" /usr/local/bin/godot
          TPL="$HOME/.local/share/godot/export_templates/${GODOT_VERSI}.stable"
          mkdir -p "$TPL"
          unzip -q templates.tpz "templates/android_*" "templates/version.txt" -d tpl
          mv tpl/templates/* "$TPL/"
          rm -f templates.tpz godot.zip
          ls "$TPL"

      - name: Atur Android SDK dan keystore di pengaturan editor
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/build-tools"
          mkdir -p "$HOME/.config/godot"
          KS="$GITHUB_WORKSPACE/tools/android/jejakpenti-debug.keystore"
          cat > "$HOME/.config/godot/editor_settings-4.3.tres" <<EOT
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$KS"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOT
          cat "$HOME/.config/godot/editor_settings-4.3.tres"

      - name: Impor aset
        working-directory: src
        run: godot --headless --import || true

      - name: Ekspor APK
        working-directory: src
        run: |
          mkdir -p "$GITHUB_WORKSPACE/apk"
          godot --headless --export-debug "Android" "$GITHUB_WORKSPACE/apk/JejakPenti.apk"
          test -f "$GITHUB_WORKSPACE/apk/JejakPenti.apk"
          ls -la "$GITHUB_WORKSPACE/apk"
          "$ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | sort -V | tail -1)/apksigner" verify --print-certs "$GITHUB_WORKSPACE/apk/JejakPenti.apk" | head -3

      - name: Simpan APK sebagai artifact
        uses: actions/upload-artifact@v4
        with:
          name: JejakPenti-apk
          path: apk/JejakPenti.apk

      - name: Terbitkan APK di Releases (tag apk-terbaru)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-terbaru
          target_commitish: ${{ github.sha }}
          name: "Jejak Penti - APK Android terbaru"
          prerelease: true
          overwrite_files: true
          files: apk/JejakPenti.apk
          body: |
            APK Android **Jejak Penti di Wae Rebo** (dibangun otomatis dari commit ${{ github.sha }}).

            Cara memasang di HP Android:
            1. Unduh **JejakPenti.apk** di bawah ini.
            2. Buka file yang sudah diunduh. Bila diminta, izinkan "Instal aplikasi tidak dikenal" untuk browser/file manager.
            3. Ketuk **Instal**, lalu buka aplikasi **Jejak Penti** (ikon Mbaru Niang).
